name: CI

on:
  # Branches with an open PR are covered by pull_request; pushing them too
  # would run every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only checks out the code and runs checks.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.8
      - run: ruff check --output-format=github .

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the server runs; 3.10 is the floor in pyproject.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Refuse to run with the Lua app tests silently skipped
        # Skipping without lupa is right on the gaming PC and wrong here.
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); import lua_harness; sys.exit(0) if lua_harness.available() else sys.exit('lupa missing: the Lua app tests would skip, which CI must not allow')"

      - name: Run tests
        # AC_TESTS_STRICT makes a missing optional dependency fail at import
        # instead of skipping.
        env:
          AC_TESTS_STRICT: "1"
        run: python -m pytest tests/ -v --durations=10

      - name: Refuse to pass if nothing exercised the Lua app
        # A floor equal to the current count, so dropping a test fails CI.
        # Raise it when tests are added; the lua job uses the same figure.
        env:
          AC_TESTS_STRICT: "1"
        run: python run_tests.py -k "^test_lua_app\." --no-skip --min-tests 29

      - name: Check each module also runs standalone
        # The gaming PC may not have pytest, so every test module has a
        # __main__ runner. --no-skip so a skipping module doesn't count.
        run: python run_tests.py --isolate --no-skip

  lua:
    name: lua (syntax + app behavior)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Lua tooling
        run: python -m pip install "luaparser>=3.2" "lupa>=2.0" pytest

      - name: Verify the runtime is the Lua the game runs
        # CSP runs LuaJIT 2.1 (Lua 5.1); lupa defaults to the newest Lua,
        # where `7 // 2` parses and string.format('%d', 1.5) raises.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tests')
          import lua_harness
          if not lua_harness.available():
              sys.exit("lupa missing: the Lua app tests would skip, "
                       "which defeats the point of this job")
          info = lua_harness.runtime_info()
          print("lua runtime:", info)
          if info["module"] != lua_harness.LUAJIT_MODULE or not info["jit"]:
              sys.exit(f"expected {lua_harness.LUAJIT_MODULE}, got {info} -- "
                       f"the app would be tested against an interpreter it "
                       f"never meets in the game")
          PY

      - name: Parse the in-game app
        # CSP reports load errors only in a debug window.
        env:
          AC_TESTS_STRICT: "1"
        run: python run_tests.py --lua-only

      - name: Run the in-game app against a stubbed CSP API
        env:
          AC_TESTS_STRICT: "1"
        run: python -m pytest tests/test_lua_app.py -v --no-header

      - name: Refuse to pass if the Lua tests did not actually run
        env:
          AC_TESTS_STRICT: "1"
        run: python run_tests.py -k "^test_lua_app\." --no-skip --min-tests 29

      - name: Check the implicit-globals check itself ran
        env:
          AC_TESTS_STRICT: "1"
        run: python run_tests.py -k "implicit_globals" --no-skip --min-tests 1

  powershell:
    name: powershell (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and lint the installer scripts
        # Windows PowerShell 5.1, not pwsh 7: the scripts run by double-click
        # on machines that have only 5.1.
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE ERRORS in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object {
                Write-Host ("  line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
              }
            } else {
              Write-Host "ok  $($_.Name) ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { exit 1 }

      - name: Guard against writing a UTF-8 BOM into the Claude config
        # Claude Desktop's JSON parser rejects a BOM, and
        # Set-Content -Encoding UTF8 writes one in PowerShell 5.1.
        shell: powershell
        run: |
          $bad = Get-ChildItem -Filter *.ps1 -Recurse | ForEach-Object {
            $code = (Get-Content $_.FullName) | Where-Object { $_ -notmatch '^\s*#' }
            if ($code -match 'Set-Content[^\n]*-Encoding\s+UTF8') { $_.Name }
          }
          if ($bad) {
            Write-Host "Set-Content -Encoding UTF8 writes a BOM in PS 5.1: $bad" -ForegroundColor Red
            exit 1
          }
          Write-Host "ok  no BOM-writing config paths"

      - name: Reject PowerShell 7-only syntax
        shell: powershell
        run: |
          $patterns = @{
            'null-coalescing (??)'      = '\?\?'
            'ConvertFrom-Json -AsHashtable' = 'ConvertFrom-Json[^\r\n]*-AsHashtable'
            'ConvertFrom-Json -Depth'   = 'ConvertFrom-Json[^\r\n]*-Depth'
            'Get-Error'                 = '\bGet-Error\b'
          }
          $failed = $false
          Get-ChildItem -Filter *.ps1 -Recurse | ForEach-Object {
            $name = $_.Name
            $code = ((Get-Content $_.FullName) |
                     Where-Object { $_ -notmatch '^\s*#' }) -join "`n"
            foreach ($p in $patterns.GetEnumerator()) {
              if ($code -match $p.Value) {
                Write-Host "$name uses $($p.Key) - not available in PS 5.1" -ForegroundColor Red
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "ok  no PS7-only syntax"
