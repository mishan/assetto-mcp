name: CI

on:
  # Only main on push. A branch with an open PR would otherwise run the
  # whole matrix twice for every commit -- once for `push`, once for
  # `pull_request` -- which is eight identical jobs saying the same thing.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the deployment target -- the server runs on the gaming
        # PC next to Assetto Corsa -- so it is not an afterthought here.
        # Ubuntu is the fast feedback loop. 3.10 is the floor declared in
        # pyproject; 3.13 catches what is coming.
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        # The suite binds ephemeral localhost ports and drives a fake
        # SimInfo, so it needs neither Assetto Corsa nor Windows-specific
        # anything -- but it does exercise the real bridge over real HTTP.
        run: python -m pytest tests/ -v --durations=10

      - name: Check each module also runs standalone
        # The gaming PC has Python (the server needs it) but no reason to
        # have pytest, so every test module has a __main__ runner. This
        # keeps that path from rotting, and run_tests.py --isolate is the
        # same check the developer runs locally rather than a shell loop
        # that only exists in CI.
        run: python run_tests.py --isolate

  lua:
    name: lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install luaparser
        run: python -m pip install luaparser

      - name: Parse the in-game app
        # CSP loads this at runtime and reports failures in a debug window
        # nobody has open, so a syntax error costs a session to notice.
        # Same check the developer runs locally, rather than a copy of it
        # that only exists in YAML and can drift.
        run: python run_tests.py --lua-only

  powershell:
    name: powershell (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse and lint the installer scripts
        # Deliberately `shell: powershell` (5.1, the one built into
        # Windows) rather than pwsh (7). These scripts run by double-click
        # on a machine that has only 5.1, so PS7-only syntax parsing
        # cleanly under pwsh would be a false pass.
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE ERRORS in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object {
                Write-Host ("  line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
              }
            } else {
              Write-Host "ok  $($_.Name) ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { exit 1 }

      - name: Guard against writing a UTF-8 BOM into the Claude config
        # Claude Desktop's JSON parser rejects a BOM, and
        # Set-Content -Encoding UTF8 adds one in PowerShell 5.1. Every
        # config write must go through .NET WriteAllText instead.
        shell: powershell
        run: |
          $bad = Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $code = (Get-Content $_.FullName) | Where-Object { $_ -notmatch '^\s*#' }
            if ($code -match 'Set-Content[^\n]*-Encoding\s+UTF8') { $_.Name }
          }
          if ($bad) {
            Write-Host "Set-Content -Encoding UTF8 writes a BOM in PS 5.1: $bad" -ForegroundColor Red
            exit 1
          }
          Write-Host "ok  no BOM-writing config paths"

      - name: Reject PowerShell 7-only syntax
        shell: powershell
        run: |
          $patterns = @{
            'null-coalescing (??)'      = '\?\?'
            'ConvertFrom-Json -AsHashtable' = 'ConvertFrom-Json[^\r\n]*-AsHashtable'
            'ConvertFrom-Json -Depth'   = 'ConvertFrom-Json[^\r\n]*-Depth'
            'Get-Error'                 = '\bGet-Error\b'
          }
          $failed = $false
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $name = $_.Name
            $code = ((Get-Content $_.FullName) |
                     Where-Object { $_ -notmatch '^\s*#' }) -join "`n"
            foreach ($p in $patterns.GetEnumerator()) {
              if ($code -match $p.Value) {
                Write-Host "$name uses $($p.Key) - not available in PS 5.1" -ForegroundColor Red
                $failed = $true
              }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "ok  no PS7-only syntax"
