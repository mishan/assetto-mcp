[project]
name = "assetto-mcp"
version = "0.1.0"
description = "MCP server exposing Assetto Corsa telemetry and setup files to an AI assistant"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Misha Nasledov", email = "misha@nasledov.com" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
# The suite runs without pytest too (each file has a __main__ runner), so
# that a single test can be run on the gaming PC with nothing installed.
# lupa embeds a Lua runtime so the in-game app can be executed against a
# stubbed CSP API. Without it those tests skip, and every bug the app has
# shipped -- a scheduler whose comment disagreed with its code, a probe that
# threw, an expression whose precedence made it a constant -- was invisible
# to syntax checking and would have been caught by running it.
test = ["pytest>=7", "lupa>=2.0", "luaparser>=3.2"]

[project.scripts]
assetto-mcp = "assetto_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assetto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers so a typo in a skipif marker is an error rather than a
# marker that never matches; --strict-config likewise for this table. The
# skip that mattered most was not a marker at all -- a test that caught
# ImportError and returned -- so see AC_TESTS_STRICT in tests/lua_harness.py
# for the guard that catches those.
addopts = ["--strict-markers", "--strict-config"]
# Tests import their shared harness as `support`, so tests/ must be on the
# path. rootdir-relative imports alone don't achieve that under pytest's
# default importmode.
pythonpath = [".", "tests"]
filterwarnings = [
    # ctypes layout is load-bearing in sim_info; a deprecation there should
    # fail the build rather than scroll past.
    "error::DeprecationWarning:assetto_mcp.*",
]
