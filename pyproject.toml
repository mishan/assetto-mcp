[project]
name = "ac-race-engineer"
version = "0.1.0"
description = "MCP server exposing Assetto Corsa telemetry and setup files to Claude"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
# The suite runs without pytest too (each file has a __main__ runner), so
# that a single test can be run on the gaming PC with nothing installed.
# lupa embeds a Lua runtime so the in-game app can be executed against a
# stubbed CSP API. Without it those tests skip, and every bug the app has
# shipped -- a scheduler whose comment disagreed with its code, a probe that
# threw, an expression whose precedence made it a constant -- was invisible
# to syntax checking and would have been caught by running it.
test = ["pytest>=7", "lupa>=2.0", "luaparser>=3.2"]

[project.scripts]
ac-race-engineer = "ac_race_engineer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ac_race_engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import their shared harness as `support`, so tests/ must be on the
# path. rootdir-relative imports alone don't achieve that under pytest's
# default importmode.
pythonpath = [".", "tests"]
filterwarnings = [
    # ctypes layout is load-bearing in sim_info; a deprecation there should
    # fail the build rather than scroll past.
    "error::DeprecationWarning:ac_race_engineer.*",
]
