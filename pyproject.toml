[project]
name = "assetto-mcp"
version = "0.1.0"
description = "MCP server exposing Assetto Corsa telemetry and setup files to an AI assistant"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Misha Nasledov", email = "misha@nasledov.com" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
# Every test module also runs without pytest, so a single file can be run on
# the gaming PC. lupa runs the in-game app against a stubbed CSP API and
# luaparser checks it; without them those tests skip.
test = ["pytest>=7", "lupa>=2.0", "luaparser>=3.2"]
# tests/eval/tool_choice.py against the Anthropic API.
eval = ["anthropic"]

[project.scripts]
assetto-mcp = "assetto_mcp.supervisor:main"
assetto-mcp-update = "assetto_mcp.update:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assetto_mcp"]

[tool.setuptools.package-data]
# The line map's page, read at runtime by line_map.render.
assetto_mcp = ["line_map.html", "dash.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo in a marker or in this table is an error, not a silent no-op.
# AC_TESTS_STRICT (tests/lua_harness.py) turns optional-dependency skips into
# failures.
addopts = ["--strict-markers", "--strict-config"]
# Tests import their shared harness as `support`.
pythonpath = [".", "tests"]
filterwarnings = [
    # ctypes layout is load-bearing in sim_info.
    "error::DeprecationWarning:assetto_mcp.*",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Single-letter names like `l` for a lap are the domain's own shorthand.
ignore = ["E741"]
