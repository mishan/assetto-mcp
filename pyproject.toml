[project]
name = "telemetrist"
version = "0.2.0"
description = "An AI race engineer for sim racing: an MCP server for game telemetry and setup files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Misha Nasledov", email = "misha@nasledov.com" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
# Every test module also runs without pytest, so a single file can be run on
# the gaming PC. lupa runs the in-game app against a stubbed CSP API and
# luaparser checks it; without them those tests skip.
test = ["pytest>=7", "pytest-xdist>=3", "lupa>=2.0", "luaparser>=3.2"]
# tests/eval/tool_choice.py against the Anthropic API.
eval = ["anthropic"]

[project.scripts]
telemetrist = "telemetrist.supervisor:main"
telemetrist-update = "telemetrist.update:main"
telemetrist-pit-wall = "telemetrist.pit_wall:main"
# The names from before the rename, which client configs may still use.
assetto-mcp = "telemetrist.supervisor:main"
assetto-mcp-update = "telemetrist.update:main"
assetto-mcp-pit-wall = "telemetrist.pit_wall:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# assetto_mcp is the old name, forwarding to telemetrist.
packages = ["telemetrist", "telemetrist.sims", "assetto_mcp"]

[tool.setuptools.package-data]
# The line map's page, read at runtime by line_map.render.
telemetrist = ["line_map.html", "dash.html", "overlay.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A typo in a marker or in this table is an error, not a silent no-op.
# AC_TESTS_STRICT (tests/lua_harness.py) turns optional-dependency skips into
# failures.
addopts = ["--strict-markers", "--strict-config"]
# Tests import their shared harness as `support`.
pythonpath = [".", "tests"]
filterwarnings = [
    # ctypes layout is load-bearing in sim_info.
    "error::DeprecationWarning:telemetrist.*",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Single-letter names like `l` for a lap are the domain's own shorthand.
ignore = ["E741"]
